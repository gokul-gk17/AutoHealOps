define command {
    command_name    check_autohealops_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_autohealops_api
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u /api/health -e 200 -s '"ok":true'
}

define command {
    command_name    check_autohealops_web
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 80 -u / -e 200
}

define command {
    command_name    check_autohealops_mongodb
    command_line    $USER1$/check_tcp -H 172.22.80.1 -p 27017 -w 2 -c 5
}

define host {
    use                 generic-host
    host_name           devwrapped
    alias               Dev Wrapped Application VM
    address             192.168.56.102
    check_command       check_autohealops_ping!100.0,20%!500.0,60%
    check_interval      1
    retry_interval      1
    max_check_attempts  2
    contacts            nagiosadmin
}

define service {
    use                 generic-service
    host_name           devwrapped
    service_description Dev Wrapped API
    check_command       check_autohealops_api
    check_interval      1
    retry_interval      1
    max_check_attempts  2
    contacts            nagiosadmin
    event_handler               autohealops_service_recovery
    event_handler_enabled       1
}


define service {
    use                 generic-service
    host_name           devwrapped
    service_description Dev Wrapped Website
    check_command       check_autohealops_web
    check_interval      1
    retry_interval      1
    max_check_attempts  2
    contacts            nagiosadmin
}

define service {
    use                 generic-service
    host_name           devwrapped
    service_description MongoDB Connectivity
    check_command       check_autohealops_mongodb
    check_interval      1
    retry_interval      1
    max_check_attempts  2
    contacts            nagiosadmin
}


define command {
    command_name    autohealops_service_recovery
    command_line    /usr/local/bin/autohealops-event-handler '$SERVICESTATE$' '$SERVICESTATETYPE$' '$SERVICEDESC$'
}
